; CamSec – ESP32-CAM PlatformIO project
; Board: AI-Thinker ESP32-CAM (OV2640)
;
; Flash instructions:
;   1. Connect GPIO0 to GND and power-cycle to enter flash mode
;   2. After upload, disconnect GPIO0 from GND and reset the board
;   3. To enter config mode: hold BOOT (GPIO0) pressed for 3 s after power-on

[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino

lib_deps =
    knolleary/PubSubClient @ ^2.8

; Partitions: larger app partition needed for camera + web server
board_build.partitions = huge_app.csv

monitor_speed  = 115200
upload_speed   = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
