# Mosquitto MQTT Broker – CamSec configuration

# ── Network ──────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

# ── Authentication ────────────────────────────────────────────────────────────
# MQTT_AUTH=0  →  allow_anonymous true  (no credentials required)
# MQTT_AUTH=1  →  allow_anonymous false + password_file enabled
#
# The file /mosquitto/config/passwd is generated at container startup by
# the init script (mosquitto/scripts/entrypoint.sh) using mosquitto_passwd.
# Users are defined via the MQTT_USERS environment variable in docker-compose.
#
# To switch to authenticated mode set MQTT_AUTH=1 in the .env file and
# define MQTT_USERS as a space-separated list of "user:password" pairs, e.g.:
#   MQTT_USERS=cam01:secret broker:admin123

allow_anonymous false
password_file /mosquitto/config/passwd

# ── Message size ──────────────────────────────────────────────────────────────
# Allow messages up to 10 MB (camera chunks are 4 KB, alert images ~200 KB)
max_packet_size 10485760

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
