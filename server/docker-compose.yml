# CamSec – Docker Compose stack
#
# Services:
#   detector  – YOLOv8 person detector + MQTT alert publisher
#   viewer    – HTTP dashboard (real-time alert viewer)
#
# Both services connect to an external MQTT broker via the host network stack.
# Set MQTT_BROKER to the IP / hostname of the broker in the .env file.
#
# Quick start:
#   cp .env.example .env   # edit MQTT_BROKER and credentials
#   docker compose up --build -d
#
# Dashboard: http://localhost:8080
# Embed panel (iframe): http://localhost:8080/embed
#
# Logs:
#   docker compose logs -f detector
#   docker compose logs -f viewer
#
# Stop:
#   docker compose down

services:

  # ── Person Detector ──────────────────────────────────────────────────────────
  detector:
    image: ${DETECTOR_IMAGE:-ghcr.io/aureliroura/camsec-detector:latest}
    build: ./detector
    container_name: camsec-detector
    restart: unless-stopped
    environment:
      # ── MQTT broker (external) ──────────────────────────────────────────────
      # Set MQTT_BROKER to the IP or hostname of the existing broker.
      # If the broker runs in another Docker network use its container name
      # and add that network under 'networks:' below.
      MQTT_BROKER:  ${CAMSEC_MQTT_BROKER:-localhost}
      MQTT_PORT:    ${CAMSEC_MQTT_PORT:-1883}
      MQTT_USER:    ${DETECTOR_MQTT_USER:-}
      MQTT_PASS:    ${DETECTOR_MQTT_PASS:-}
      MQTT_CLIENT:  camsec-detector

      # ── Detection ────────────────────────────────────────────────────────────
      YOLO_MODEL:   /models/yolov8n.pt  # path dins del volum persistent
      CONFIDENCE:   "0.45"      # Minimum detection confidence (0.0–1.0)
      CHUNK_SIZE:   "4096"      # Must match the ESP32-CAM CHUNK_SIZE

      # ── Operational ──────────────────────────────────────────────────────────
      STALE_TTL_S:  "60"        # Discard incomplete image buffers after N seconds
      SAME_PERSON_ALERT_THRESHOLD: ${SAME_PERSON_ALERT_THRESHOLD:-5}  # warn after N consecutive image/same
      SAME_PERSON_ALERT_STEP:      ${SAME_PERSON_ALERT_STEP:-5}       # repeat warning every N additional same events
      LOG_LEVEL:    ${DETECTOR_LOG_LEVEL:-INFO}  # DEBUG | INFO | WARNING | ERROR
      YOLO_IMGSZ:   "320"       # Resize input to this before inference (saves RAM on Pi)
    volumes:
      # Cache the YOLOv8 weights across container restarts
      - yolo-cache:/root/.config/Ultralytics
      - yolo-models:/models
    # Uses the host network stack – the container sees the same interfaces and
    # routes as the host machine, so it reaches the MQTT broker at MQTT_BROKER
    # exactly as any other process on this server would.
    network_mode: host
    mem_limit: "900m"
    memswap_limit: "2g"

  # ── Alert Viewer ─────────────────────────────────────────────────────────────
  viewer:
    image: ${VIEWER_IMAGE:-ghcr.io/aureliroura/camsec-viewer:latest}
    build: ./viewer
    container_name: camsec-viewer
    restart: unless-stopped
    environment:
      MQTT_BROKER:  ${CAMSEC_MQTT_BROKER:-localhost}
      MQTT_PORT:    ${CAMSEC_MQTT_PORT:-1883}
      MQTT_USER:    ${VIEWER_MQTT_USER:-}
      MQTT_PASS:    ${VIEWER_MQTT_PASS:-}
      MQTT_CLIENT:  camsec-viewer
      CHUNK_SIZE:   "4096"
      MAX_ALERTS:   "50"       # max images kept in memory
      HTTP_HOST:    "0.0.0.0"
      HTTP_PORT:    "${VIEWER_HTTP_PORT:-8088}"
      LOG_LEVEL:    ${VIEWER_LOG_LEVEL:-INFO}
      PERSIST_DIR:     /data/alerts   # directory for persisted alert images
      MAX_DISK_ALERTS: "500"          # max images to keep on disk
      MAX_DISK_DAYS:   "7"            # max days to keep images
    volumes:
      - ${ALERTS_DIR:-/home/pi/camsec-alerts}:/data/alerts
    # network_mode:host lets the viewer reach the broker via any host interface
    # (including 127.0.0.1) on Linux. On Windows/macOS Docker Desktop it must
    # be commented out and the ports block below must be enabled instead.
    #
    # Linux   → keep network_mode: host (and leave ports commented)
    # Windows → comment network_mode and uncomment ports
    network_mode: host
    # ports:                                   # Only needed on Windows/macOS (no network_mode: host)
    #   - "${VIEWER_HTTP_PORT:-8088}:${VIEWER_HTTP_PORT:-8088}"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  yolo-cache:
  yolo-models:
